add_newline = false
format = "$hostname$directory$git_branch$git_status$fill$cmd_duration$line_break$character"
[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold yellow"
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "yellow"
[fill]
symbol = " "
[cmd_duration]
min_time = 2000
format = "[$duration]($style)"
style = "dimmed white"
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
